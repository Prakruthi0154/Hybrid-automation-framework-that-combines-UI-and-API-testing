# Override with -D<key>=value or environment variables where noted in README.
# The default CI suite validates framework components without contacting an AUT.
# Use -Pintegration-suite or -Papi-suite only after configuring reachable services.
env=qa
base.url=https://your-store.example
api.base.url=https://your-api.example
browser=chrome
headless=true
explicit.wait.seconds=10
page.load.timeout.seconds=30
api.connect.timeout.ms=10000
api.read.timeout.ms=20000

# These are example REST resource paths; adapt to the target application's contract.
api.users.path=/api/users
api.login.path=/api/auth/login
api.products.path=/api/products
api.cart.path=/api/cart
api.orders.path=/api/orders
api.test.product.id=replace-with-real-product-id

# UI selectors use CSS by default. Change these to match the AUT.
ui.login.email=input[name='email']
ui.login.password=input[name='password']
ui.login.submit=button[type='submit']
ui.logout=button[data-testid='logout']
ui.search=input[name='search']
ui.search.submit=button[data-testid='search-submit']
ui.product.card=[data-testid='product-card']
ui.product.add=button[data-testid='add-to-cart']
ui.cart.link=a[href*='cart']
ui.cart.quantity=input[name='quantity']
ui.cart.remove=button[data-testid='remove-from-cart']
ui.checkout=button[data-testid='checkout']
ui.place.order=button[data-testid='place-order']
ui.order.confirmation=[data-testid='order-confirmation']
ui.order.number=[data-testid='order-number']
